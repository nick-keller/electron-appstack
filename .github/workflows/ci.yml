name: CI

# Checks this monorepo. The template has its own workflows in template/.github, which only run
# in apps created from it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      # electron-vite starts Electron to compile bytecode. Ubuntu 24.04 blocks the unprivileged user
      # namespaces Chromium's sandbox needs, so Electron aborts unless they are allowed again.
      - name: Allow the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm --filter electron-app exec electron-vite build
      - run: pnpm --filter docs build

      - name: Check that template/package-lock.json is up to date
        run: |
          pnpm lock:template
          git diff --exit-code template/package-lock.json
