name: Release

# On every push to main:
# 1. If there are changesets, open or update the "Version Packages" pull request.
# 2. If the version in package.json has no git tag yet (the pull request was just merged),
#    tag it, then build, sign and publish the app for macOS, Windows and Linux.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.tag.outputs.release }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Create or update the release pull request
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the version if needed
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag "v$version"
          git push origin "v$version"
          # Created once here, so the build jobs upload their files to the same draft release
          gh release create "v$version" --draft --title "v$version" --notes ""
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # The license SDK keeps its data in the system keychain with a native module, which npm only
      # installs for the runner's architecture. Add the other architecture built on this runner.
      - name: Install the keychain module for every architecture
        if: runner.os != 'Linux'
        shell: bash
        run: |
          version=$(node -p "require('@napi-rs/keyring/package.json').version")
          if [ "$RUNNER_OS" = macOS ]; then
            targets="darwin-arm64 darwin-x64"
          else
            targets="win32-x64-msvc win32-arm64-msvc"
          fi
          npm install --no-save --force --no-audit --no-fund \
            $(for target in $targets; do echo "@napi-rs/keyring-$target@$version"; done)

      - name: Prepare the App Store Connect API key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_BASE64 != ''
        shell: bash
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: Build, sign and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (Developer ID Application certificate, .p12 as base64)
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          # macOS notarization (App Store Connect API key)
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows code signing (Azure Trusted Signing)
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Publish the release with the changelog as release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Section of CHANGELOG.md between "## <version>" and the next "## "
          awk -v version="$VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md 2>/dev/null || true
          gh release edit "v$VERSION" --draft=false --notes-file notes.md

      # Licensing: record the version in LicenseManager, so licenses that don't include the newest
      # version are offered this one (`latestAllowedVersion`). Set the LICENSEMANAGER_PRODUCT_ID
      # variable and the LICENSEMANAGER_API_KEY secret in the repository settings to enable it.
      - name: Record the release in LicenseManager
        if: vars.LICENSEMANAGER_PRODUCT_ID != ''
        env:
          LICENSEMANAGER_API_KEY: ${{ secrets.LICENSEMANAGER_API_KEY }}
          PRODUCT_ID: ${{ vars.LICENSEMANAGER_PRODUCT_ID }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            "https://api.licensemanager.dev/v1/products/$PRODUCT_ID/releases" \
            -H "x-api-key: $LICENSEMANAGER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"version\": \"$VERSION\"}")
          cat response.json
          # 409 version_taken: already recorded, e.g. when the workflow is re-run
          [ "$status" = 201 ] || [ "$status" = 409 ]
